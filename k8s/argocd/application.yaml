apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-ticketing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nilpc/Event-Ticketing-System.git
    targetRevision: main
    path: k8s/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: event-ticketing
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

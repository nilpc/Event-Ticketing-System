apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-scaler
  namespace: event-ticketing
  labels:
    app.kubernetes.io/name: admitter
    app.kubernetes.io/part-of: event-ticketing
spec:
  scaleTargetRef:
    name: admitter
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "0 8 * * *"
        end: "0 2 * * *"
        desiredReplicas: "1"

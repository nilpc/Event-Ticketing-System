# Local development stack. Mirrors the Kubernetes deployment (k8s/base) so the
# same Docker images run here and in production:
#   postgres → redis → api (FastAPI) + web (nginx) [+ workers profile]
#
# Usage:
#   docker compose up --build                  # start the full stack
#   docker compose up -d --build               # detached
#   docker compose --profile workers up -d     # + standalone worker containers
#   docker compose down -v                     # stop and wipe the DB volume
#
# The api service already runs the three background workers in-process (FR-9 /
# NFR-3), so they are NOT started by default. Start them as separate containers
# with the `workers` profile to mirror the k8s/base worker deployments exactly.
#
# Host ports are configurable via .env (see .env.example). Defaults avoid
# clashing with a host Postgres on 5432:
#   POSTGRES_PORT=5433  REDIS_PORT=6379  WEB_PORT=8080
# After boot, open http://localhost:8080 (admin seeded with ADMIN_PASSWORD).

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: api
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/event_ticketing
    REDIS_URL: redis://redis:6379/0
    # Browser origin of the SPA — CORS must match it.
    CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
    CLIENT_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    # Empty JWT keys → entrypoint.sh generates ephemeral RSA keys (dev mode).
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    # Seeded master admin password. Unset → a random one is printed in api logs.
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-console}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: event_ticketing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d event_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    # Runs migrations + seed on first boot (entrypoint.sh), then serves gunicorn
    # on :8000. The image HEALTHCHECK drives `depends_on: service_healthy`.

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        NGINX_UPSTREAM: api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  sweeper:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "sweeper"]
    healthcheck:
      disable: true

  relay:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "relay"]
    healthcheck:
      disable: true

  admitter:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "admitter"]
    healthcheck:
      disable: true

volumes:
  pgdata:

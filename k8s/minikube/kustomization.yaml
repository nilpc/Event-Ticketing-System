# Minikube overlay — local K8s testing.
# Apply via:  kubectl apply -k k8s/minikube/
#
# Prerequisites:
#   minikube start
#   eval $(minikube docker-env)
#   docker build -t event-ticketing:latest .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: event-ticketing

resources:
  # Everything from base
  - ../base

  # Local infrastructure
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - ingress.yaml

  # Migration job (no Helm hooks — works with kubectl apply)
  - migration-job.yaml

patches:
  # ── Delete resources not needed in Minikube ──
  - patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: queue-scaler
        namespace: event-ticketing
      $patch: delete
  # CPU HPAs need metrics-server, which minikube doesn't run, and they force
  # minPods=2 — contradicting the "scale down for local dev" replicas patches.
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway-api-hpa
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway-web-hpa
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gateway-only
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: gateway-external-access
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate
        namespace: event-ticketing
      $patch: delete

  # ── Scale down for local dev ──
  - target:
      kind: Deployment
      name: gateway-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/initContainers
  - target:
      kind: Deployment
      name: gateway-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Standalone workers are redundant on minikube — gateway-api already runs
  # sweeper/relay/admitter in-process (same as `docker compose` default).
  - target:
      kind: Deployment
      name: sweeper
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: relay
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: admitter
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

# Phase 7: cert-manager ClusterIssuers for Let's Encrypt (staging for testing, prod for real).
# HTTP-01 challenge: the solver ingress joins the gateway ALB via the shared ingress group,
# so ACME validation does NOT provision a second ALB.
# Requires cert-manager installed (helm). Ready even without a domain; issuance happens
# once an ingress has a `tls:` host that resolves to the ALB.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # add a real contact address here once a domain is in use:
    # email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: alb
            ingressTemplate:
              metadata:
                annotations:
                  alb.ingress.kubernetes.io/group.name: event-ticketing
                  alb.ingress.kubernetes.io/scheme: internet-facing
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # add a real contact address here once a domain is in use:
    # email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: alb
            ingressTemplate:
              metadata:
                annotations:
                  alb.ingress.kubernetes.io/group.name: event-ticketing
                  alb.ingress.kubernetes.io/scheme: internet-facing

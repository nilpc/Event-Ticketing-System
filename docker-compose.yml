x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
    target: api
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://testuser:testpass@postgres:5432/event_ticketing
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:8080}
    CLIENT_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-console}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: event_ticketing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d event_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    <<: *backend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        NGINX_UPSTREAM: api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
  sweeper:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "sweeper"]
    healthcheck:
      disable: true
  relay:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "relay"]
    healthcheck:
      disable: true
  admitter:
    <<: *backend
    profiles: ["workers"]
    command: ["python", "-m", "services.workers", "admitter"]
    healthcheck:
      disable: true
volumes:
  pgdata:

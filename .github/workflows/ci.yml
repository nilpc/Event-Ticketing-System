name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy core services --ignore-missing-imports
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/event_ticketing
      REDIS_URL: redis://localhost:6379/0
      LOG_FORMAT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/identity/ tests/booking/test_integration.py tests/booking/test_concurrency.py tests/gateway/test_rate_limit.py tests/payment/ -x -q
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event-ticketing/web typecheck
      - run: pnpm --filter @event-ticketing/web lint
      - run: pnpm --filter @event-ticketing/web build
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
  rate-limit-cache-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/event_ticketing
      REDIS_URL: redis://localhost:6379/0
      LOG_FORMAT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/booking/test_cache.py tests/booking/test_catalog_cache.py -x -q
  websocket-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/event_ticketing
      REDIS_URL: redis://localhost:6379/0
      LOG_FORMAT: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/gateway/test_websocket_manager.py -x -q
  migration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
    env:
      DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/event_ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Seed a fresh DB (validates seed.py + admin bootstrap)
        run: ADMIN_PASSWORD="CITestPass!234" python seed.py
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t event-ticketing-api:ci --target api .
      - name: Build Web image
        run: >-
          docker build -t event-ticketing-web:ci --target web

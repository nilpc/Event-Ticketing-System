apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: event-ticketing

resources:
  - ../base
  - ingress.yaml

images:
  - name: event-ticketing-api
    newName: ghcr.io/nilpc/event-ticketing-api
    newTag: main
  - name: event-ticketing-web
    newName: ghcr.io/nilpc/event-ticketing-web
    newTag: main

patches:
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: event-ticketing-secrets
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate
        namespace: event-ticketing
      $patch: delete

  # ── Gateway API: spot tolerations + node selector ──
  - target:
      kind: Deployment
      name: gateway-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: spot
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Gateway Web: spot tolerations + node selector ──
  - target:
      kind: Deployment
      name: gateway-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: spot
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Sweeper: spot tolerations ──
  - target:
      kind: Deployment
      name: sweeper
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: spot
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Relay: spot tolerations ──
  - target:
      kind: Deployment
      name: relay
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: spot
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Admitter: spot tolerations ──
  - target:
      kind: Deployment
      name: admitter
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: spot
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: spot
            operator: Equal
            value: "true"
            effect: NoSchedule
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

# Redis HA: the `redis` ClusterIP service load-balances across the master
# and replica pods. The app uses plain (non-sentinel) Redis clients, so
# writes must go ONLY to the master pod. This service pins the master
# pod (must match `redis-cli -p 26379 SENTINEL get-master-addr-by-name
# mymaster`) so writes never hit the read-only replica. If the pin goes
# stale after a failover, update the selector to the current master pod.
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: event-ticketing
  labels:
    app.kubernetes.io/name: redis-master
    app.kubernetes.io/part-of: event-ticketing
spec:
  type: ClusterIP
  selector:
    statefulset.kubernetes.io/pod-name: redis-node-1
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

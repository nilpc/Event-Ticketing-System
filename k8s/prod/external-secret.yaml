apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: event-ticketing-secrets
  namespace: event-ticketing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: event-ticketing-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /event-ticketing/DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: /event-ticketing/REDIS_URL
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /event-ticketing/REDIS_PASSWORD
    - secretKey: CORS_ORIGINS
      remoteRef:
        key: /event-ticketing/CORS_ORIGINS
    - secretKey: CLIENT_ORIGIN
      remoteRef:
        key: /event-ticketing/CLIENT_ORIGIN
    - secretKey: LOG_LEVEL
      remoteRef:
        key: /event-ticketing/LOG_LEVEL
    - secretKey: LOG_FORMAT
      remoteRef:
        key: /event-ticketing/LOG_FORMAT
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: /event-ticketing/STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: /event-ticketing/STRIPE_WEBHOOK_SECRET
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: /event-ticketing/GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: /event-ticketing/GOOGLE_CLIENT_SECRET
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /event-ticketing/SENTRY_DSN
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: /event-ticketing/JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: /event-ticketing/JWT_PUBLIC_KEY

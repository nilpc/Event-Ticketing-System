apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: event-ticketing

resources:
  - ../base
  - ingress.yaml
  - external-secret.yaml
  - cluster-issuer.yaml
  - redis-master-service.yaml

images:
  - name: event-ticketing-api
    newName: 078682762568.dkr.ecr.us-east-1.amazonaws.com/event-ticketing-api
    newTag: main
  - name: event-ticketing-web
    newName: 078682762568.dkr.ecr.us-east-1.amazonaws.com/event-ticketing-web
    newTag: main

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate
        namespace: event-ticketing
      $patch: delete

  # ── Gateway API: 2 replicas, on-demand node selector ──
  - target:
      kind: Deployment
      name: gateway-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: on-demand
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Gateway Web: 2 replicas, on-demand node selector ──
  - target:
      kind: Deployment
      name: gateway-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: on-demand
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Sweeper: on-demand node selector ──
  - target:
      kind: Deployment
      name: sweeper
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: on-demand
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Relay: on-demand node selector ──
  - target:
      kind: Deployment
      name: relay
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: on-demand
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # ── Admitter: on-demand node selector ──
  - target:
      kind: Deployment
      name: admitter
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-type: on-demand
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: event-ticketing
resources:
  - ../base
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - ingress.yaml
  - migration-job.yaml
patches:
  - patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: queue-scaler
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway-api-hpa
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway-web-hpa
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gateway-only
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: gateway-external-access
        namespace: event-ticketing
      $patch: delete
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: migrate
        namespace: event-ticketing
      $patch: delete
  - target:
      kind: Deployment
      name: gateway-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/initContainers
  - target:
      kind: Deployment
      name: gateway-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: sweeper
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: relay
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: admitter
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

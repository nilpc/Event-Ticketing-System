# Phase 7: ALB Ingress — routes external traffic to the gateway service.
# Requires AWS Load Balancer Controller installed in the cluster.
# WAFv2 ACL is attached via the wafv2-acl-arn annotation (ARN is stable, managed by terraform waf.tf).
# HTTPS via cert-manager (letsencrypt ClusterIssuer) requires a custom domain pointing
# at this ALB. Uncomment the TLS section + listen-ports when a domain is available.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: event-ticketing
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: event-ticketing
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: event-ticketing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # cert-manager: issue/rotate via the letsencrypt-prod ClusterIssuer.
    # The HTTP-01 solver ingress uses the same ALB class (see cluster-issuer.yaml).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/acme-challenge-type: http01
    # Uncomment for HTTPS (requires a domain pointing at this ALB + DNS record):
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:078682762568:regional/webacl/event-ticketing-web-acl/bbe766ec-f5ea-463c-8231-efd20a8e6bf5
spec:
  rules:
    # Uncomment for HTTPS redirect:
    # - http:
    #     paths:
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: gateway
    #             port:
    #               name: use-annotation
    #         annotations:
    #           alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
# Uncomment once a domain is configured:
# tls:
#   - hosts:
#       - tickets.example.com
#     secretName: gateway-tls
